name: Scrape NSE Rolling Stats (daily)

# ──────────────────────────────────────────────────────────────────────────────
# PATCH 0798 — 20-day rolling stats per NSE ticker.
# Pulls last 20 BHAVCOPY files, computes vol20DAvg / volMultiple / mom1M /
# pctOf52wHigh per ticker. Vercel /api/market/quotes reads this blob and
# merges stats into ticker payload so catalyst-scoring engine can label
# moves with "Vol 3.2× 20D avg / Position unwind / Near 52w high".
#
# Runs once daily after Indian market close.
# ──────────────────────────────────────────────────────────────────────────────

on:
  schedule:
    # 22:30 IST → 17:00 UTC, ~3h after market close, gives NSE archives time
    # to publish the day's BHAVCOPY
    - cron: '12 17 * * 1-5'   # weekdays only
  workflow_dispatch: {}

concurrency:
  group: scrape-rolling-stats
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Run rolling stats scraper
        id: main
        env:
          UPSTASH_REDIS_REST_URL:   ${{ secrets.UPSTASH_REDIS_REST_URL }}
          UPSTASH_REDIS_REST_TOKEN: ${{ secrets.UPSTASH_REDIS_REST_TOKEN }}
        run: |
          if [ -z "$UPSTASH_REDIS_REST_URL" ] || [ -z "$UPSTASH_REDIS_REST_TOKEN" ]; then
            echo "::error title=Missing secrets::Set UPSTASH_REDIS_REST_URL + UPSTASH_REDIS_REST_TOKEN in repo secrets."
            exit 1
          fi
          rc=0; node .github/scripts/scrape-rolling-stats.mjs || rc=$?
          # zzz908: exit 75 = upstream down / not published yet → green run + warning + "deferred" heartbeat note;
          # the next scheduled run retries. Any other non-zero exit (bug, auth, bad data) stays red.
          if [ "$rc" -eq 75 ]; then echo "deferred=1" >> "$GITHUB_OUTPUT"; exit 0; fi
          if [ "$rc" -ne 0 ]; then exit "$rc"; fi

      - name: Upstream deferred (data not updated this run)
        if: steps.main.outputs.deferred == '1'
        run: echo "::notice title=Deferred::An upstream source was down or had not published yet. Stored data was kept; the next scheduled run retries. The daily actions-watchdog flags a job that stays deferred for 24 h."
