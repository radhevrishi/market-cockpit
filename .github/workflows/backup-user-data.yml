name: Backup personal data (nightly, with restore drill)

# Version 2 includes the US portfolio. Drill restores into disposable PostgreSQL
# and Redis, then reads every record back. Only authenticated ciphertext is kept.
# Decrypt new artifacts with:
# PASS=... node .github/scripts/user-data-backup.mjs decrypt user-data.json.enc user-data.json
# Legacy artifacts still use the documented openssl AES-CBC command.
on:
  schedule:
    - cron: '17 1 * * *'
  workflow_dispatch: {}
concurrency:
  group: backup-user-data
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  backup:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: drill
          POSTGRES_PASSWORD: restore-drill-only
          POSTGRES_DB: restore_drill
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U drill -d restore_drill"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install locked restore tooling
        working-directory: frontend
        run: npm ci --no-audit --no-fund --legacy-peer-deps
      - name: Verify dedicated backup passphrase
        env:
          PASS: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          if [ -z "$PASS" ]; then echo '::error::Set BACKUP_PASSPHRASE in repository Actions secrets before exporting personal data.'; exit 1; fi
      - name: Export including US book
        env:
          CRON_BASE_URL: ${{ secrets.CRON_BASE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          BASE="${CRON_BASE_URL:-https://market-cockpit-production.up.railway.app}"
          curl -fsS --max-time 120 -H "x-cron-secret: $CRON_SECRET" "$BASE/api/v1/user-state?export=1" -o user-data.json
          node .github/scripts/user-data-backup.mjs verify user-data.json
      - name: Restore into isolated databases and read back
        working-directory: frontend
        env:
          RESTORE_DATABASE_URL: postgres://drill:restore-drill-only@127.0.0.1:5432/restore_drill
          RESTORE_REDIS_URL: redis://127.0.0.1:6379
        run: node --import tsx ../.github/scripts/user-data-backup.mjs restore-check ../user-data.json
      - name: Encrypt and authenticate artifact round-trip
        env:
          PASS: ${{ secrets.BACKUP_PASSPHRASE }}
        run: node .github/scripts/user-data-backup.mjs encrypt user-data.json user-data.json.enc
      - name: Remove plaintext even after failure
        if: always()
        run: python3 -c "from pathlib import Path; Path('user-data.json').unlink(missing_ok=True)"
      - uses: actions/upload-artifact@v4
        with:
          name: user-data-${{ github.run_id }}
          path: user-data.json.enc
          retention-days: 90
          if-no-files-found: error
