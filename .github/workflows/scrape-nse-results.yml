name: Scrape NSE Financial Results list (every 2h, 7 days)

# zzz875 — reads NSE's financial-results list (the filings the Earnings hub confirms a results
# card from) for the last 7 days and stores it on the server (KV nse-results:v1:day:<day>).
# NSE refuses the Railway server, so without this a company that filed its results was dropped
# as "scheduled, no filing confirmed" (ANSALAPI / HAWAENG / HIIL on 3 Oct 2026). One-off backfill:
# Actions → this workflow → "Run workflow" → days = 60.
# Secrets: CRON_SECRET (same value as on the server), CRON_BASE_URL (optional). Nothing secret is printed.

on:
  schedule:
    # every 2 h, 09:20–23:20 IST (03:50–17:50 UTC): results land after market hours and late evenings (Saturdays too)
    - cron: '50 3,5,7,9,11,13,15,17 * * *'
  workflow_dispatch:
    inputs:
      days:
        description: 'Days to read back from today (1-60)'
        required: false
        default: '7'

concurrency:
  group: scrape-nse-results
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  collect:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout repo
        uses: actions/checkout@v5
      - name: Setup Node 22
        uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Collect the results list
        id: main
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          CRON_BASE_URL: ${{ secrets.CRON_BASE_URL }}
          PROXY_URL: ${{ secrets.PROXY_URL || vars.PROXY_URL }}
          PROXY_SECRET: ${{ secrets.PROXY_SECRET || vars.PROXY_SECRET }}
          IN_DAYS: ${{ github.event.inputs.days || '7' }}
        run: |
          set -euo pipefail
          if [ -z "${CRON_SECRET}" ]; then echo "CRON_SECRET is not set in repository secrets"; exit 1; fi
          export CRON_BASE_URL="${CRON_BASE_URL:-https://market-cockpit-production.up.railway.app}"
          case "$IN_DAYS" in ''|*[!0-9]*) IN_DAYS=7 ;; esac
          if [ "$IN_DAYS" -gt 60 ]; then IN_DAYS=60; fi
          export DAYS="$IN_DAYS"
          rc=0; node .github/scripts/scrape-nse-results.mjs || rc=$?
          # zzz908: exit 75 = upstream down / not published yet → green run + warning + "deferred" heartbeat note;
          # the next scheduled run retries. Any other non-zero exit (bug, auth, bad data) stays red.
          if [ "$rc" -eq 75 ]; then echo "deferred=1" >> "$GITHUB_OUTPUT"; exit 0; fi
          if [ "$rc" -ne 0 ]; then exit "$rc"; fi

      - name: Upstream deferred (data not updated this run)
        if: steps.main.outputs.deferred == '1'
        run: echo "::notice title=Deferred::An upstream source was down or had not published yet. Stored data was kept; the next scheduled run retries. The daily actions-watchdog flags a job that stays deferred for 24 h."
      - name: Heartbeat (always run)
        if: always()
        env:
          BASE: ${{ secrets.CRON_BASE_URL }}
        run: |
          BASE="${BASE:-https://market-cockpit-production.up.railway.app}"
          OK="true"
          if [[ "${{ steps.main.outcome }}" != "success" ]]; then OK="false"; fi
          NOTE=''; if [[ "${{ steps.main.outputs.deferred }}" == "1" ]]; then NOTE=',"error":"deferred: upstream not available, data kept as it was"'; fi
          curl -s --max-time 15 -X POST "$BASE/api/v1/cron/heartbeat" \
            -H 'Content-Type: application/json' \
            -d "{\"name\":\"scrape-nse-results\",\"phase\":\"end\",\"ok\":$OK$NOTE,\"run_url\":\"${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}\"}" \
            -o /dev/null -w "heartbeat %{http_code}\n" || true
