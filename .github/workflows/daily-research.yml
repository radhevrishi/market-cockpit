name: Daily Research (Gainers + Portfolio Catalysts)

# zzz773 — the owner's daily clicks, on a schedule. Uses only public app
# endpoints; model spend is bounded by the server's own daily ceilings.
on:
  # zzz907: portfolio (13:14 UTC daily) and gainers-us (21:30 UTC Mon-Fri) now run INSIDE the app (frontend/src/lib/app-scheduler.ts,
  # jobs daily-research-portfolio / daily-research-gainers-us) because GitHub's cron skipped runs and each run cost paid minutes.
  # gainers-in stays here: it pre-fetches screener.in pages from GitHub's network (screener.in does not answer the app host).
  schedule:
    - cron: '50 10 * * 1-5'   # 16:20 IST Mon-Fri → India gainers after the close
  workflow_dispatch:
    inputs:
      job:
        description: 'Which job'
        required: true
        default: gainers-in
        type: choice
        options: [gainers-in, gainers-us, portfolio]
      reprocess:
        description: 'Re-research the whole day from scratch (gainers only)'
        required: false
        default: false
        type: boolean

concurrency:
  group: daily-research-${{ github.event.schedule || github.event.inputs.job }}
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Resolve job
        id: job
        run: |
          case "${{ github.event.schedule }}" in
            "50 10 * * 1-5") echo "name=gainers-in" >> "$GITHUB_OUTPUT" ;;
            "13 14 * * *")    echo "name=portfolio"  >> "$GITHUB_OUTPUT" ;;
            "30 21 * * 1-5") echo "name=gainers-us" >> "$GITHUB_OUTPUT" ;;
            *)               echo "name=${{ github.event.inputs.job }}" >> "$GITHUB_OUTPUT" ;;
          esac
      - name: Run
        id: main
        env:
          CRON_BASE_URL: ${{ secrets.CRON_BASE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}   # zzz778 — personal-data / AI APIs need the service key
          UPSTASH_REDIS_REST_URL: ${{ secrets.UPSTASH_REDIS_REST_URL }}
          UPSTASH_REDIS_REST_TOKEN: ${{ secrets.UPSTASH_REDIS_REST_TOKEN }}
          REPROCESS: ${{ (github.event_name == 'schedule' || github.event.inputs.reprocess == 'true') && '1' || '' }}
        run: |
          rc=0; node .github/scripts/daily-research.mjs "${{ steps.job.outputs.name }}" || rc=$?
          # zzz908: exit 75 = upstream down / not published yet → green run + warning + "deferred" heartbeat note;
          # the next scheduled run retries. Any other non-zero exit (bug, auth, bad data) stays red.
          if [ "$rc" -eq 75 ]; then echo "deferred=1" >> "$GITHUB_OUTPUT"; exit 0; fi
          if [ "$rc" -ne 0 ]; then exit "$rc"; fi

      - name: Upstream deferred (data not updated this run)
        if: steps.main.outputs.deferred == '1'
        run: echo "::notice title=Deferred::An upstream source was down or had not published yet. Stored data was kept; the next scheduled run retries. The daily actions-watchdog flags a job that stays deferred for 24 h."
      - name: Heartbeat (always run)
        if: always()
        env:
          CRON_BASE_URL: ${{ secrets.CRON_BASE_URL }}
        run: |
          BASE="${CRON_BASE_URL:-https://market-cockpit-production.up.railway.app}"
          OK="true"; if [[ "${{ steps.main.outcome }}" != "success" ]]; then OK="false"; fi
          NOTE=''; if [[ "${{ steps.main.outputs.deferred }}" == "1" ]]; then NOTE=',"error":"deferred: upstream not available, data kept as it was"'; fi
          curl -s --max-time 15 -X POST "$BASE/api/v1/cron/heartbeat" -H 'Content-Type: application/json' \
            -d "{\"name\":\"daily-research-${{ steps.job.outputs.name }}\",\"phase\":\"end\",\"ok\":$OK$NOTE}" -o /dev/null -w "heartbeat %{http_code}\n" || true
