name: Scrape Screener Fundamentals (daily, rotating)

# ──────────────────────────────────────────────────────────────────────────────
# PATCH 0800 — Per-ticker fundamentals from screener.in.
#
# Processes 200 tickers per run, rotating through the universe. 2155 tickers
# / 200 per run ≈ 11 runs to cover everything → 11 days to fully refresh.
# Daily run schedule means each ticker gets refreshed at least once / 1-2 weeks.
#
# Output: per-ticker KV keys 'fundamentals:v1:<TICKER>' (24h TTL on each
# but rolling rotation refreshes them).
#
# Used by catalyst-scoring engine to detect 'quality of earnings' issues
# like the SPARC case (PAT spike on exceptional gains, revenue flat).
# ──────────────────────────────────────────────────────────────────────────────

on:
  schedule:
    # 23:30 IST daily → 18:00 UTC. After Indian market close.
    - cron: '14 18 * * *'
  workflow_dispatch: {}

concurrency:
  group: scrape-screener-fundamentals
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Run Screener fundamentals scraper
        id: main
        env:
          UPSTASH_REDIS_REST_URL:   ${{ secrets.UPSTASH_REDIS_REST_URL }}
          UPSTASH_REDIS_REST_TOKEN: ${{ secrets.UPSTASH_REDIS_REST_TOKEN }}
        run: |
          if [ -z "$UPSTASH_REDIS_REST_URL" ] || [ -z "$UPSTASH_REDIS_REST_TOKEN" ]; then
            echo "::error title=Missing secrets::Set UPSTASH_REDIS_REST_URL + UPSTASH_REDIS_REST_TOKEN in repo secrets."
            exit 1
          fi
          rc=0; node .github/scripts/scrape-screener-fundamentals.mjs || rc=$?
          # zzz908: exit 75 = upstream down / not published yet → green run + warning + "deferred" heartbeat note;
          # the next scheduled run retries. Any other non-zero exit (bug, auth, bad data) stays red.
          if [ "$rc" -eq 75 ]; then echo "deferred=1" >> "$GITHUB_OUTPUT"; exit 0; fi
          if [ "$rc" -ne 0 ]; then exit "$rc"; fi

      - name: Upstream deferred (data not updated this run)
        if: steps.main.outputs.deferred == '1'
        run: echo "::notice title=Deferred::An upstream source was down or had not published yet. Stored data was kept; the next scheduled run retries. The daily actions-watchdog flags a job that stays deferred for 24 h."
