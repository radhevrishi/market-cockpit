name: Actions watchdog (daily digest of real failures)

# zzz908 — ONE daily look at every workflow run of the last 24 h. Failures are sorted into
# "GitHub had no machine" / "a data source was down" / "replaced by a newer run" (nothing to do) and
# "needs a look" (code error, secret/auth problem, bad data, job ran out of time, or a collector whose
# source stayed down all day). A Telegram message is sent ONLY when something needs a look.
# Once this digest is trusted, GitHub's per-run failure e-mails can be switched off at
# github.com/settings/notifications (section "Actions") — see docs/RELIABILITY.md.
#
# Telegram: TELEGRAM_BOT_TOKEN + TELEGRAM_CHAT_ID repository secrets when set; otherwise the app's
# /api/v1/alerts/dispatch (needs CRON_SECRET), which uses the app's own Telegram settings.
# Logic + test: .github/scripts/actions-watchdog.mjs, frontend/src/lib/__tests__/zzz908-actions-reliability.test.ts

on:
  schedule:
    - cron: '23 3 * * *'      # 03:23 UTC / 08:53 IST daily (odd minute: avoids the top-of-hour queue)
  workflow_dispatch:
    inputs:
      hours:
        description: 'Look-back window in hours (1-168)'
        required: false
        default: '24'
      dry_run:
        description: '1 = classify and print only, send nothing'
        required: false
        default: '0'

concurrency:
  group: actions-watchdog
  cancel-in-progress: false

permissions:
  actions: read     # list runs + jobs
  checks: read      # read the failure annotations
  contents: read    # sparse checkout of .github

jobs:
  watch:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          sparse-checkout: .github
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Classify the last day of runs
        id: main
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          WINDOW_HOURS: ${{ github.event.inputs.hours || '24' }}
          DRY_RUN: ${{ github.event.inputs.dry_run || '0' }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          CRON_BASE_URL: ${{ secrets.CRON_BASE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          rc=0; node .github/scripts/actions-watchdog.mjs || rc=$?
          if [ "$rc" -eq 75 ]; then echo "deferred=1" >> "$GITHUB_OUTPUT"; exit 0; fi
          if [ "$rc" -ne 0 ]; then exit "$rc"; fi

      - name: Heartbeat (always run)
        if: always()
        env:
          CRON_BASE_URL: ${{ secrets.CRON_BASE_URL }}
        run: |
          BASE="${CRON_BASE_URL:-https://market-cockpit-production.up.railway.app}"
          OK="true"
          if [[ "${{ steps.main.outcome }}" != "success" ]]; then OK="false"; fi
          NOTE=''; if [[ "${{ steps.main.outputs.deferred }}" == "1" ]]; then NOTE=',"error":"deferred: GitHub API not reachable"'; fi
          curl -s --max-time 15 -X POST "$BASE/api/v1/cron/heartbeat" \
            -H 'Content-Type: application/json' \
            -d "{\"name\":\"actions-watchdog\",\"phase\":\"end\",\"ok\":$OK$NOTE,\"run_url\":\"${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}\"}" \
            -o /dev/null -w "heartbeat %{http_code}\n" || true
