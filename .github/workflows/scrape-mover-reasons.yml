name: Scrape Mover Reasons (hourly during market hours)

# ──────────────────────────────────────────────────────────────────────────────
# PATCH 0801 — For each extreme NSE mover (≥10%), pull news from 4 free
# public sources (Google News RSS, Moneycontrol, Trendlyne, Yahoo Finance)
# to find the actual catalyst. Writes per-ticker KV keys that Vercel reads
# to surface real headlines instead of generic "No confirmed trigger".
#
# Schedule: hourly during market hours (09:00-16:00 IST) + once post-close,
# plus workflow_dispatch for manual triggers. GH Actions free tier is
# unlimited for public repos.
# ──────────────────────────────────────────────────────────────────────────────

on:
  schedule:
    # PATCH 0975 — cut 8/day → 4/day. Was firing every hour during NSE
    # market hours which was burning Vercel Hobby-tier function-execution
    # quota (~30 GB-hr/week from this single workflow). Now: 2 mid-session
    # snapshots, post-close sweep, evening update. Same operational value
    # for users (they don't refresh /movers every hour), much less load.
    - cron: '15 5 * * 1-5'   # 10:45 IST — mid-morning snapshot
    - cron: '3 11 * * 1-5'   # 16:30 IST — post-close sweep
    - cron: '3 14 * * 1-5'   # 19:30 IST — evening update (zzz933: weekdays only, mid-day run dropped, for GitHub minutes)
  workflow_dispatch: {}

concurrency:
  group: scrape-mover-reasons
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Run mover-reasons scraper
        id: main
        env:
          UPSTASH_REDIS_REST_URL:   ${{ secrets.UPSTASH_REDIS_REST_URL }}
          UPSTASH_REDIS_REST_TOKEN: ${{ secrets.UPSTASH_REDIS_REST_TOKEN }}
        run: |
          if [ -z "$UPSTASH_REDIS_REST_URL" ] || [ -z "$UPSTASH_REDIS_REST_TOKEN" ]; then
            echo "::error title=Missing secrets::Set UPSTASH_REDIS_REST_URL + UPSTASH_REDIS_REST_TOKEN in repo secrets."
            exit 1
          fi
          rc=0; node .github/scripts/scrape-mover-reasons.mjs || rc=$?
          # zzz908: exit 75 = upstream down / not published yet → green run + warning + "deferred" heartbeat note;
          # the next scheduled run retries. Any other non-zero exit (bug, auth, bad data) stays red.
          if [ "$rc" -eq 75 ]; then echo "deferred=1" >> "$GITHUB_OUTPUT"; exit 0; fi
          if [ "$rc" -ne 0 ]; then exit "$rc"; fi

      - name: Upstream deferred (data not updated this run)
        if: steps.main.outputs.deferred == '1'
        run: echo "::notice title=Deferred::An upstream source was down or had not published yet. Stored data was kept; the next scheduled run retries. The daily actions-watchdog flags a job that stays deferred for 24 h."

      - name: Heartbeat (always run)
        if: always()
        env:
          CRON_BASE_URL: ${{ secrets.CRON_BASE_URL }}
        run: |
          # 10y-ops Section 7.3: POST heartbeat so mc-guardian detects silent stops.
          BASE="${CRON_BASE_URL:-https://market-cockpit-production.up.railway.app}"
          OK="true"
          if [[ "${{ steps.main.outcome }}" != "success" ]]; then OK="false"; fi
          NOTE=''; if [[ "${{ steps.main.outputs.deferred }}" == "1" ]]; then NOTE=',"error":"deferred: upstream not available, data kept as it was"'; fi
          curl -s --max-time 15 -X POST "$BASE/api/v1/cron/heartbeat" \
            -H 'Content-Type: application/json' \
            -d "{\"name\":\"scrape-mover-reasons\",\"phase\":\"end\",\"ok\":$OK$NOTE,\"run_url\":\"${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}\"}" \
            -o /dev/null -w "heartbeat %{http_code}\n" || true
