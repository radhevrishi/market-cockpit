name: Scrape Guidance Docs (India, every 2h evening IST)

# zzz857 — collects the companies' OWN guidance-bearing documents (earnings-call
# transcripts, investor presentations, results press releases, AGM / chairman
# speeches) from BSE corporate announcements across all companies (NSE and the
# mc-proxy worker as fallbacks), extracts their text with pdftotext and stores
# them via POST /api/v1/guidance-docs/ingest. Runs here because NSE / BSE refuse
# Railway's datacenter range.
#
# Scheduled runs read the last 7 days (documents already stored or skipped are
# not downloaded again). For the one-off 120-day backfill: Actions → this
# workflow → "Run workflow" → days = 210 (zzz874: two quarters, so a raise has an earlier guidance to compare with).
#
# Secrets (repository → Settings → Secrets and variables → Actions):
#   CRON_SECRET    — same value as CRON_SECRET on the server (service key)
#   CRON_BASE_URL  — optional; the deployed app's base URL
#   PROXY_URL      — optional; the mc-proxy worker base URL (fallback hop)
#   PROXY_SECRET   — optional; the worker's PROXY_SECRET (needed for api.bseindia.com / nseindia.com via the worker)
# The script prints counts only: never a secret, never document text.

on:
  schedule:
    # every 2 h from 15:20 to 23:20 IST (09:50–17:50 UTC), when results and call transcripts land, plus an early-morning and a late-night sweep for filings made after hours (zzz863)
    - cron: '50 3,9,11,13,15,17,21 * * *'
  workflow_dispatch:
    inputs:
      days:
        description: 'Days to read back from today (1-210; 210 = the one-off backfill that reaches the previous quarter''s calls, zzz874)'
        required: false
        default: '7'
      bse_mode:
        description: 'BSE listing: auto (all categories for manual runs and the last 2 days), sub (category filters), all'
        required: false
        default: 'auto'
      max_downloads:
        description: 'Max PDFs to download in this run'
        required: false
        default: '6000'
      include_plain_results:
        description: 'Also read plain "Financial Results" PDFs (1 = yes; large, few carry guidance)'
        required: false
        default: '0'

concurrency:
  group: scrape-guidance-docs
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  collect:
    runs-on: ubuntu-24.04
    timeout-minutes: ${{ github.event_name == 'workflow_dispatch' && 340 || 60 }}
    steps:
      - name: Checkout repo
        uses: actions/checkout@v5

      - name: Setup Node 22
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Install pdftotext
        run: sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils > /dev/null && pdftotext -v 2>&1 | head -1

      - name: Collect documents
        id: main
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          CRON_BASE_URL: ${{ secrets.CRON_BASE_URL }}
          PROXY_URL: ${{ secrets.PROXY_URL }}
          PROXY_SECRET: ${{ secrets.PROXY_SECRET }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          IN_DAYS: ${{ github.event.inputs.days || '7' }}
          IN_MODE: ${{ github.event.inputs.bse_mode || 'auto' }}
          IN_MAX: ${{ github.event.inputs.max_downloads || '' }}
          IN_PLAIN: ${{ github.event.inputs.include_plain_results || '0' }}
        run: |
          set -euo pipefail
          if [ -z "${CRON_SECRET}" ]; then echo "CRON_SECRET is not set in repository secrets"; exit 1; fi
          export CRON_BASE_URL="${CRON_BASE_URL:-https://market-cockpit-production.up.railway.app}"
          case "$IN_DAYS" in ''|*[!0-9]*) IN_DAYS=7 ;; esac
          if [ "$IN_DAYS" -gt 210 ]; then IN_DAYS=210; fi
          case "$IN_MODE" in auto|sub|all) ;; *) IN_MODE=auto ;; esac
          case "$IN_MAX" in ''|*[!0-9]*) IN_MAX=600 ;; esac
          export DAYS="$IN_DAYS" BSE_MODE="$IN_MODE" MAX_DOWNLOADS="$IN_MAX"
          export INCLUDE_PLAIN_RESULTS="$([ "$IN_PLAIN" = "1" ] && echo 1 || echo 0)"
          # leave ~10 min of the job limit for the final POSTs
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then export RUN_BUDGET_MIN=325; else export RUN_BUDGET_MIN=48; fi
          rc=0; node .github/scripts/scrape-guidance-docs.mjs || rc=$?
          # zzz908: exit 75 = upstream down / not published yet → green run + warning + "deferred" heartbeat note;
          # the next scheduled run retries. Any other non-zero exit (bug, auth, bad data) stays red.
          if [ "$rc" -eq 75 ]; then echo "deferred=1" >> "$GITHUB_OUTPUT"; exit 0; fi
          if [ "$rc" -ne 0 ]; then exit "$rc"; fi

      - name: Upstream deferred (data not updated this run)
        if: steps.main.outputs.deferred == '1'
        run: echo "::notice title=Deferred::An upstream source was down or had not published yet. Stored data was kept; the next scheduled run retries. The daily actions-watchdog flags a job that stays deferred for 24 h."

      - name: Heartbeat (always run)
        if: always()
        env:
          BASE: ${{ secrets.CRON_BASE_URL }}
        run: |
          BASE="${BASE:-https://market-cockpit-production.up.railway.app}"
          OK="true"
          if [[ "${{ steps.main.outcome }}" != "success" ]]; then OK="false"; fi
          NOTE=''; if [[ "${{ steps.main.outputs.deferred }}" == "1" ]]; then NOTE=',"error":"deferred: upstream not available, data kept as it was"'; fi
          curl -s --max-time 15 -X POST "$BASE/api/v1/cron/heartbeat" \
            -H 'Content-Type: application/json' \
            -d "{\"name\":\"scrape-guidance-docs\",\"phase\":\"end\",\"ok\":$OK$NOTE,\"run_url\":\"${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}\"}" \
            -o /dev/null -w "heartbeat %{http_code}\n" || true
