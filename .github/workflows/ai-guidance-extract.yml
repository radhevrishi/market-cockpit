name: AI Guidance Extract (hourly)

# zzz857 — reads the company's OWN documents collected by the guidance-docs collectors
# (earnings-call transcripts, investor presentations, results releases / 8-K exhibit
# 99.1 — India and US) and extracts forward guidance rows with the configured model
# (AI_PROVIDER / OPENAI_API_KEY on the server, monthly cap AI_MONTHLY_CAP_USD). Every
# row's quote is checked against the document text and every number against the quote;
# rows that fail are dropped and counted. Results: KV guidance-extract:v1:<docId>.
#
# Order: transcripts / presentations / results releases first, newest first, India and
# US interleaved. One request stops starting documents in time to answer inside the
# request limit (stoppedBy=time / limit); the job then sends another round (zzz872: up to
# 40 rounds, 10 minutes) while documents and the run's spend cap remain. The schedule below is mirrored in
# src/lib/ai-guidance-extract.ts (GUIDANCE_EXTRACT_SCHEDULE) — keep them equal.
# Runs at :50, after the collectors and the AI verifier (:35).
#
# Secrets (repository → Settings → Secrets and variables → Actions):
#   CRON_SECRET    — the same value as CRON_SECRET on the server (service key)
#   CRON_BASE_URL  — optional; the deployed app's base URL
# No secret is ever written inline or printed: the key travels in a header read from
# the environment, and only the HTTP status + counts are echoed.

on:
  # zzz907: the schedule now runs INSIDE the app (frontend/src/lib/app-scheduler.ts, job(s): ai-guidance-extract) because GitHub's cron
  # skipped/delayed runs and every run cost paid Actions minutes (private repo). Kept for hand runs and as an emergency fallback.
  workflow_dispatch:
    inputs:
      limit:
        description: 'Documents per round (1-100); rounds repeat until the queue, the spend cap or the minutes are used'
        required: false
        default: '40'
      max_usd:
        description: 'Spend cap for this run in USD (max 2; the monthly cap still binds)'
        required: false
        default: '0.60'
      max_minutes:
        description: 'Stop sending rounds after this many minutes (1-12)'
        required: false
        default: '10'
      doc_ids:
        description: 'zzz917: read only these documents now (comma-separated doc ids, max 60). Each is one small paid read; the monthly cap binds.'
        required: false
        default: ''

concurrency:
  group: ai-guidance-extract
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  extract:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Run extraction rounds
        id: main
        env:
          BASE: ${{ secrets.CRON_BASE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          LIMIT: ${{ github.event.inputs.limit || '40' }}
          MAX_USD: ${{ github.event.inputs.max_usd || '0.25' }}   # zzz918: was 0.40 (zzz915: was 1.20); the route also caps each UTC day
          MAX_MIN: ${{ github.event.inputs.max_minutes || '20' }}
          DOC_IDS: ${{ github.event.inputs.doc_ids || '' }}
        run: |
          set -euo pipefail
          BASE="${BASE:-https://market-cockpit-production.up.railway.app}"
          if [ -z "${CRON_SECRET}" ]; then echo "CRON_SECRET is not set in repository secrets"; exit 1; fi
          # zzz917: targeted reads (owner asked for specific companies) — one POST ?docId= per id, then stop
          IDS=$(printf '%s' "$DOC_IDS" | tr -cd 'A-Za-z0-9_,-' | tr ',' ' ')
          if [ -n "$IDS" ]; then
            N=0
            for ID in $IDS; do
              N=$((N + 1)); [ "$N" -gt 60 ] && break
              STATUS=$(curl -sS -o /tmp/ge1.json -w "%{http_code}" --max-time 75 -X POST -H "x-cron-secret: ${CRON_SECRET}" "$BASE/api/v1/guidance-extract?docId=${ID}&limit=1&maxUsd=0.05" || echo "000")
              python3 -c "import json;r=(json.load(open('/tmp/ge1.json')).get('run') or {});print('$ID HTTP $STATUS', 'ok=',r.get('ok'),'noGuidance=',r.get('noGuidance'),'rowsKept=',r.get('rowsKept'),'usd=',r.get('spentUsd'))" 2>/dev/null || echo "$ID HTTP $STATUS"
              sleep 16   # the route allows 4 POSTs a minute
            done
            exit 0
          fi
          case "$LIMIT" in ''|*[!0-9]*) LIMIT=40 ;; esac
          case "$MAX_USD" in ''|*[!0-9.]*) MAX_USD=0.25 ;; esac
          case "$MAX_MIN" in ''|*[!0-9]*) MAX_MIN=20 ;; esac
          [ "$MAX_MIN" -lt 1 ] && MAX_MIN=1
          [ "$MAX_MIN" -gt 25 ] && MAX_MIN=25
          # zzz872: keep sending rounds until the queue is empty, the spend cap for this run is used, or the minutes are up.
          # Before, the job stopped after ONE round of 25 documents and left most of its allowance unused (3,500 documents would have taken weeks).
          END=$(( $(date +%s) + MAX_MIN * 60 ))
          LEFT_USD=$MAX_USD
          TOTAL=0; EMPTY=0; FAILED=0
          for ROUND in $(seq 1 40); do
            if [ "$(date +%s)" -ge "$END" ]; then echo "minutes for this run used (${MAX_MIN}); the next hourly run continues"; break; fi
            STATUS=$(curl -sS -o /tmp/guidance-extract.json -w "%{http_code}" --max-time 75 -X POST \
              -H "x-cron-secret: ${CRON_SECRET}" -H 'Content-Type: application/json' \
              "$BASE/api/v1/guidance-extract?limit=${LIMIT}&maxUsd=${LEFT_USD}" || echo "000")
            echo "round ${ROUND}: guidance-extract HTTP $STATUS"
            if [ "$STATUS" != "200" ]; then FAILED=1; break; fi
            # counts only (the response never carries keys or document text); prints "<again> <usd left> <docs this round>"
            NEXT=$(LEFT_USD="$LEFT_USD" python3 - <<'PY' || echo "0 0 0"
          import json, os, sys
          try:
              j = json.load(open('/tmp/guidance-extract.json'))
              r = j.get('run') or {}
              keys = ['available', 'stoppedBy', 'queued', 'attempted', 'screened', 'ok', 'noGuidance', 'unreadable', 'errors', 'skippedBackoff', 'alreadyDone', 'missingDoc', 'rowsKept', 'rowsDropped', 'spentUsd', 'elapsedMs']
              print(' '.join(f"{k}={r.get(k)}" for k in keys), file=sys.stderr)
              if r.get('dropReasons'): print('dropped:', json.dumps(r.get('dropReasons'))[:300], file=sys.stderr)
              if r.get('unavailableReason'): print('unavailable:', str(r.get('unavailableReason'))[:200], file=sys.stderr)
              done = int(r.get('attempted') or 0) + int(r.get('screened') or 0) + int(r.get('missingDoc') or 0) + int(r.get('alreadyDone') or 0)
              usd = float(os.environ['LEFT_USD']) - float(r.get('spentUsd') or 0)
              left = int(r.get('queued') or 0) - done - int(r.get('skippedBackoff') or 0)
              stop = r.get('stoppedBy')
              again = 1 if (stop in ('time', 'limit') and usd > 0.02 and left > 0 and done > 0) else 0
              print(f"{again} {max(usd, 0):.4f} {done}")
          except Exception as e:
              print('response not readable:', e, file=sys.stderr)
              print('0 0 0')
          PY
            )
            read AGAIN LEFT_USD DONE <<< "$NEXT"
            TOTAL=$((TOTAL + DONE))
            if [ "$AGAIN" != "1" ]; then break; fi
          done
          echo "documents handled in this run: ${TOTAL} (usd left of the run cap: ${LEFT_USD})"
          if [ "$FAILED" = "1" ]; then exit 1; fi

      - name: Heartbeat (always run)
        if: always()
        env:
          BASE: ${{ secrets.CRON_BASE_URL }}
        run: |
          BASE="${BASE:-https://market-cockpit-production.up.railway.app}"
          OK="true"
          if [[ "${{ steps.main.outcome }}" != "success" ]]; then OK="false"; fi
          curl -s --max-time 15 -X POST "$BASE/api/v1/cron/heartbeat" \
            -H 'Content-Type: application/json' \
            -d "{\"name\":\"ai-guidance-extract\",\"phase\":\"end\",\"ok\":$OK,\"run_url\":\"${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}\"}" \
            -o /dev/null -w "heartbeat %{http_code}\n" || true
