name: Refresh Super Investor Holdings (6h)

# Calls /api/v1/cron/refresh-super-investors every 6 hours to keep the KV
# cache populated. Without this, the KV entries expire after 6 h and the
# read endpoint flips back to source="static" and the freshness chip turns
# amber. With this cron, the chip stays cyan ("live · …") between scrapes.
#
# Isolated workflow: failures here never affect the other cron jobs.

on:
  # zzz907: the schedule now runs INSIDE the app (frontend/src/lib/app-scheduler.ts, job(s): refresh-super-investors) because GitHub's cron
  # skipped/delayed runs and every run cost paid Actions minutes (private repo). Kept for hand runs and as an emergency fallback.
  workflow_dispatch:
    inputs:
      force:
        description: 'Force overwrite KV even if fresh (1 = yes)'
        required: false
        default: '0'

# zzz883: one run at a time — a slow run is never overlapped by the next scheduled one
concurrency:
  group: refresh-super-investors
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Hit refresh endpoint
        id: main
        env:
          BASE: ${{ secrets.CRON_BASE_URL }}
          SECRET: ${{ secrets.CRON_SECRET }}
          FORCE: ${{ github.event.inputs.force || '0' }}
        run: |
          BASE="${BASE:-https://market-cockpit-production.up.railway.app}"
          echo "base: $BASE  force: $FORCE"
          CODE=000
          for i in 1 2 3; do
            CODE=$(curl -s -m 60 -X POST -H "x-cron-secret: $SECRET" "$BASE/api/v1/cron/refresh-super-investors?force=$FORCE" \
              -o /tmp/superinv.json -w "%{http_code}") || CODE=000
            echo "attempt $i: HTTP $CODE"
            [ "$CODE" = "200" ] && break
            sleep 15
          done
          # zzz908: app down / redeploying (000, 429, 5xx) is transient — green + warning, next run retries.
          case "$CODE" in 000|429|5??) echo "::warning title=Deferred::refresh got HTTP $CODE after 3 attempts (app not reachable)"; echo "deferred=1" >> "$GITHUB_OUTPUT"; exit 0 ;; esac
          if [ "$CODE" != "200" ]; then
            echo "::error::refresh failed with HTTP $CODE after 3 attempts"
            cat /tmp/superinv.json || true
            exit 1
          fi
          echo "==response=="
          cat /tmp/superinv.json | python3 -c "import sys,json; d=json.loads(sys.stdin.read()); print(f\"written={d.get('written')} skipped={d.get('skipped')} fetchedAt={d.get('fetchedAt')}\")" || true

      - name: Upstream deferred (data not updated this run)
        if: steps.main.outputs.deferred == '1'
        run: echo "::notice title=Deferred::The app did not answer (down / redeploying). Nothing was changed; the next scheduled run retries. The daily actions-watchdog flags a job that stays deferred for 24 h."

      - name: Heartbeat (always run)
        if: always()
        env:
          CRON_BASE_URL: ${{ secrets.CRON_BASE_URL }}
        run: |
          BASE="${CRON_BASE_URL:-https://market-cockpit-production.up.railway.app}"
          OK="true"
          if [[ "${{ steps.main.outcome }}" != "success" ]]; then OK="false"; fi
          NOTE=''; if [[ "${{ steps.main.outputs.deferred }}" == "1" ]]; then NOTE=',"error":"deferred: app not reachable, retried next run"'; fi
          curl -s --max-time 15 -X POST "$BASE/api/v1/cron/heartbeat" \
            -H 'Content-Type: application/json' \
            -d "{\"name\":\"refresh-super-investors\",\"phase\":\"end\",\"ok\":$OK$NOTE,\"run_url\":\"${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}\"}" \
            -o /dev/null -w "heartbeat %{http_code}\n" || true
