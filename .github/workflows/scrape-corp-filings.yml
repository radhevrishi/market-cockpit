name: Scrape Corp Filings (2x/day)

# ──────────────────────────────────────────────────────────────────────────────
# PATCH 0739 — NSE + BSE corporate-filings ingestion via GitHub Actions.
# Feeds 4 Vercel routes that previously had to call NSE live (and hit the
# 50% upstream failure rate per CLAUDE.md §18.8):
#   • /api/v1/concall-intel/live-feed
#   • /api/v1/concall-intel/warrant-feed
#   • /api/v1/concall-intel/keyword-watch
#   • (consumers: /order-book, /rating-actions, /special-situations,
#      concall-intel page, movers-attribution engine)
#
# Vercel CPU savings: each route currently spends 5-30s per cold call
# fetching from NSE. Once the blob is populated, the route reads from
# KV in ~50ms.
#
# Required GitHub Actions secrets:
#   UPSTASH_REDIS_REST_URL    — same value as Vercel env var
#   UPSTASH_REDIS_REST_TOKEN  — same value as Vercel env var
# ──────────────────────────────────────────────────────────────────────────────

on:
  schedule:
    # PATCH 0977 — cut 4→2/day due to Vercel fair-use block. Keep pre-open
    # (07:00) for next-trading-day prep + post-close (20:30) for evening
    # batch update. Mid-day refreshes dropped — users opening /signals
    # mid-day will use last-batch data + can manually click Refresh.
    - cron: '30 1 * * *'    # 07:00 IST — pre-open
    - cron: '6 15 * * *'    # 20:30 IST — post-close evening batch
  workflow_dispatch: {}

concurrency:
  group: scrape-corp-filings
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout repo
        uses: actions/checkout@v5

      - name: Setup Node 22
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Run scraper
        id: main
        env:
          UPSTASH_REDIS_REST_URL:   ${{ secrets.UPSTASH_REDIS_REST_URL }}
          UPSTASH_REDIS_REST_TOKEN: ${{ secrets.UPSTASH_REDIS_REST_TOKEN }}
        run: |
          if [ -z "$UPSTASH_REDIS_REST_URL" ] || [ -z "$UPSTASH_REDIS_REST_TOKEN" ]; then
            echo "::error title=Missing secrets::Add UPSTASH_REDIS_REST_URL and UPSTASH_REDIS_REST_TOKEN in Settings → Secrets and variables → Actions."
            exit 1
          fi
          rc=0; node .github/scripts/scrape-corp-filings.mjs || rc=$?
          # zzz908: exit 75 = upstream down / not published yet → green run + warning + "deferred" heartbeat note;
          # the next scheduled run retries. Any other non-zero exit (bug, auth, bad data) stays red.
          if [ "$rc" -eq 75 ]; then echo "deferred=1" >> "$GITHUB_OUTPUT"; exit 0; fi
          if [ "$rc" -ne 0 ]; then exit "$rc"; fi

      - name: Upstream deferred (data not updated this run)
        if: steps.main.outputs.deferred == '1'
        run: echo "::notice title=Deferred::An upstream source was down or had not published yet. Stored data was kept; the next scheduled run retries. The daily actions-watchdog flags a job that stays deferred for 24 h."

      - name: Heartbeat (always run)
        if: always()
        env:
          CRON_BASE_URL: ${{ secrets.CRON_BASE_URL }}
          JOB_NAME: scrape-corp-filings
          COLLECTION_OUTCOME: ${{ steps.main.outcome }}
          COLLECTION_DEFERRED: ${{ steps.main.outputs.deferred }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: node .github/scripts/send-heartbeat.mjs
